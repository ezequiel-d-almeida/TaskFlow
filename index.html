<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="index.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
</head>
<body>
    <header>
        <h1>TASKFLOW</h1>
        <nav>
            <button id="todas" title="todas"><i class="fa-solid fa-table-columns"></i></button>
            <button id="pendentes" title="pendentes"><i class="fa-regular fa-clock"></i></button>
            <button id="concluidas" title="concluidas"><i class="fa-solid fa-circle-check"></i></button>
            <button id="prioridades" title="prioridades"><i class="fa-solid fa-star"></i></button>
            <input type="text" id="input__pesquisa">
            <button id="pesquisa" title="pesquisa"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button id="logout" title="logout">Logout</button>
        </nav>
    </header>

    <section id="criar">
        <div id="section_titulo">
            <label for="nova__tarefa">Titulo</label>
            <input type="text" id="nova__tarefa">
        </div>
        
        <div id="section__descricao">
            <label for="descricao">Descrição</label>
            <textarea name="descrição" id="descricao"></textarea>
        </div>
        
        <div id="configuracoes">

           <div id="section__categoria">
                <label for="categoria">Categoria</label>
                <select name="categoria" id="categoria">
                    <option value="Sem categoria">Sem categoria</option>
                    <option value="Estudos">Estudos</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Pessoal">Pessoal</option>
                </select>
            </div>
        
            <div id="section__prioridade">
                <label for="prioridade">Prioridade</label>
                <select name="prioridade" id="prioridade">
                    <option value="Sem prioridade">Sem Prioridade</option>
                    <option value="Alta">Alta</option>
                    <option value="Média">Média</option>
                    <option value="Baixa">Baixa</option>
                </select>
            </div>
             
        </div>

        

        <button id="enviar__tarefa">Enviar</button>

        <p id="campo__vazio"></p>

    </section>

    <section id="section__lista">
        <ul id="lista">
        </ul>
    </section>

    <section id="section__graficos">
        <canvas id="grafico">

        </canvas>
    </section>
    
    <script type="module" src="./dist/main.js"></script>
    <script type="module" src="dist/login/auth.js"></script>
    <script type="module" src="dist/login/logout.js"></script>
</body>
</html>
